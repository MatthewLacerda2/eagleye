apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Eagleye DB
    uid: eagleye-db
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: postgres
    jsonData:
      database: eagleye
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: postgres
