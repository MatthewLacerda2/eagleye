# Eagleye: `docker compose up -d` runs the watch and its admin.
# `docker compose --profile monitoring up -d` adds Prometheus and Grafana.

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Override host to reach the postgres service inside the compose network.
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eagleye
    FRAMES_DIR: /data/frames
  volumes:
    - ./config:/app/config:ro
    - frames:/data/frames
  restart: unless-stopped

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eagleye
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The API runs the database migrations on startup; the worker waits for it.
  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      - worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  frames:
  prometheus:
  grafana:
